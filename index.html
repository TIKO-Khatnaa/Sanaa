<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чамд зориулсан захидал</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Noto+Sans:wght@400;600&display=swap">
<style>
:root{--bg1:#ffd9e6;--bg2:#e4d6fb;--bg3:#cfe0ff;--ink:#4a2338;--soft:#8a5a70;--accent:#e0457b;--accent2:#ff8fb1;--card:rgba(255,255,255,.74);--env:#f6a9c4;--env2:#ee86ab;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1530;--bg2:#241846;--bg3:#14183a;--ink:#ffe8f0;--soft:#d8a8bf;--accent:#ff6f9c;--accent2:#ffa3c0;--card:rgba(255,255,255,.09);--env:#c9658d;--env2:#b04f77}}
:root[data-theme="dark"]{--bg1:#3a1530;--bg2:#241846;--bg3:#14183a;--ink:#ffe8f0;--soft:#d8a8bf;--accent:#ff6f9c;--accent2:#ffa3c0;--card:rgba(255,255,255,.09);--env:#c9658d;--env2:#b04f77}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3));color:var(--ink);font-family:"Noto Sans",system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
.o1{width:18rem;height:18rem;background:#ff9ec1;top:-5rem;left:-5rem}
.o2{width:16rem;height:16rem;background:#b9a4ff;bottom:-4rem;right:-4rem;animation-delay:-5s}
.o3{width:10rem;height:10rem;background:#ffd0a8;top:45%;left:60%;animation-delay:-9s}
@keyframes drift{to{transform:translate(3rem,2rem) scale(1.15)}}
.petal{position:fixed;top:-2rem;background:linear-gradient(135deg,#ffc2d6,#ff8fb1);border-radius:150% 0 150% 0;opacity:.85;animation:fall linear infinite;pointer-events:none}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(3rem,55vh) rotate(180deg)}100%{transform:translate(-1rem,112vh) rotate(380deg)}}
.stage{position:relative;z-index:2;display:grid;place-items:center;width:100%;padding:1rem}
/* envelope */
#envWrap{display:grid;justify-items:center;gap:1.6rem;transition:opacity .6s,transform .6s}
#envWrap.gone{opacity:0;transform:scale(.9) translateY(1rem);pointer-events:none}
.envelope{position:relative;width:min(78vw,20rem);aspect-ratio:3/2;background:var(--env);border-radius:.7rem;cursor:pointer;box-shadow:0 24px 50px rgba(224,69,123,.3);border:0;padding:0;transition:transform .3s}
.envelope:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
.paper{position:absolute;left:8%;right:8%;top:8%;height:80%;background:#fffafc;border-radius:.4rem;transition:transform .8s .45s}
.envelope.open .paper{transform:translateY(-45%)}
.front{position:absolute;inset:0;background:var(--env2);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:.7rem;opacity:.92}
.flap{position:absolute;top:0;left:0;width:100%;height:58%;background:var(--env);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;z-index:3;filter:brightness(1.05)}
.envelope.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2rem;z-index:4;transition:opacity .3s;animation:beat 1.5s ease-in-out infinite}
.envelope.open .seal{opacity:0}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.18)}}
.hint{font-family:"Marck Script",cursive;font-size:1.6rem;color:var(--soft);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.4rem)}}
/* card */
.card{display:none;width:min(90vw,28rem);text-align:center;padding:2.6rem 1.6rem 2.2rem;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:2rem;border:1px solid rgba(255,255,255,.55);box-shadow:0 24px 60px rgba(224,69,123,.22)}
.card.show{display:block;animation:pop .8s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(1.5rem)}}
.small{font-family:"Marck Script",cursive;font-size:1.5rem;color:var(--accent);margin:0 0 .2rem}
h1{font-family:"Marck Script",cursive;font-weight:400;font-size:clamp(2.4rem,10vw,3.5rem);line-height:1.12;margin:0 0 .8rem}
p{color:var(--soft);line-height:1.65;margin:0 0 1.8rem}
.btns{display:flex;gap:1rem;justify-content:center;align-items:center;min-height:4.2rem}
button.b{font:inherit;font-weight:600;border:0;border-radius:2rem;padding:.9rem 2.1rem;cursor:pointer;transition:transform .25s}
button.b:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#yes{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:1.12rem;box-shadow:0 8px 22px rgba(224,69,123,.4);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 34px rgba(224,69,123,.7)}}
#no{background:rgba(255,255,255,.88);color:#8a5a70;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:9}
#done{display:none}
.info{background:rgba(255,255,255,.65);color:#4a2338;border-radius:1.2rem;padding:1rem 1.3rem;text-align:left;line-height:1.9}
.info b{color:#e0457b}
.heart{position:fixed;bottom:-2rem;font-size:1.8rem;animation:up 3.6s linear forwards;pointer-events:none;z-index:10}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart,.petal,.orb,.hint,.seal,#yes{animation:none}.heart{display:none}}

.paper{background:repeating-linear-gradient(180deg,#fffafc 0 .85rem,#f4cddc .85rem calc(.85rem + 1px))}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.8);animation:tw 3s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{opacity:.1;transform:scale(.5)}}
.spark{position:fixed;pointer-events:none;z-index:20;font-size:.95rem;animation:sf .9s forwards}
@keyframes sf{to{opacity:0;transform:translateY(1.2rem) scale(.3)}}
.burst{position:fixed;pointer-events:none;z-index:30;font-size:1.4rem;animation:bu 1.2s ease-out forwards}
@keyframes bu{to{transform:translate(var(--x),var(--y)) scale(.5) rotate(var(--r));opacity:0}}
#ask h1{min-height:2.3em;margin-bottom:1.8rem}
#ask p,#ask .btns{opacity:0;transform:translateY(.6rem);transition:opacity .7s,transform .7s}
#ask.ready p,#ask.ready .btns{opacity:1;transform:none}
.bigheart{font-size:3.4rem;line-height:1;margin-bottom:.4rem;animation:beat2 1.3s ease-in-out infinite}
@keyframes beat2{50%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.star,.bigheart,.spark,.burst{animation:none}.spark,.burst{display:none}#ask p,#ask .btns{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="stage">
<div id="envWrap">
<button class="envelope" id="env" aria-label="Захидал нээх"><div class="paper"></div><div class="front"></div><div class="flap"></div><div class="seal">💗</div></button>
<div class="hint">Чамд захидал ирлээ, нээгээрэй</div>
</div>
<section class="card" id="ask">
<div class="small" id="hi">Сайн уу,</div>
<h1>Надтай болзоонд явах уу?</h1>
<div class="btns"><button class="b" id="yes">Тийм 💗</button><button class="b" id="no">Үгүй</button></div>
</section>
<section class="card" id="done">
<div class="bigheart">💞</div>
<div class="small">Баярлалаа 🌸</div>
<h1>Би маш их баяртай байна!</h1>
<div class="info">
<div><b>Хэзээ:</b> <span id="when"></span></div>
<div><b>Хаана:</b> <span id="where"></span></div>
</div>
</section>
</div>
<script>
// ===== Энд засна =====
var NAME = "";
var WHEN = "10-р сарын 6, 17:30";
var WHERE = "Юракучо өртөө (Yurakucho Station) дээр хүлээж байна";
// =====================
var $=function(i){return document.getElementById(i)};
var yes=$("yes"),no=$("no"),tries=0;
if(NAME){$("hi").textContent="Сайн уу, "+NAME+",";}
$("when").textContent=WHEN;$("where").textContent=WHERE;
for(var p=0;p<16;p++){var s=document.createElement("span");s.className="petal";
var z=.7+Math.random()*.8;s.style.width=z+"rem";s.style.height=z+"rem";
s.style.left=Math.random()*100+"vw";s.style.animationDuration=(9+Math.random()*9)+"s";
s.style.animationDelay=(-Math.random()*14)+"s";document.body.appendChild(s);}
$("env").addEventListener("click",function(){
  this.classList.add("open");
  setTimeout(function(){$("envWrap").classList.add("gone")},1300);
  setTimeout(function(){$("envWrap").style.display="none";$("ask").classList.add("show");typeIn()},1900);
});
var notes=["Үгүй","Яг үү?","Дахиад бод доо","Итгэлтэй байна уу?","Хэрэггүй ээ...","Тийм дээр дар :)"];
function dodge(e){
  if(e&&e.preventDefault)e.preventDefault();
  tries++;
  no.textContent=notes[Math.min(tries,notes.length-1)];
  yes.style.transform="scale("+Math.min(1+tries*0.1,1.8)+")";
  no.style.position="fixed";
  var w=window.innerWidth-no.offsetWidth-24,h=window.innerHeight-no.offsetHeight-24;
  no.style.left=(12+Math.random()*w)+"px";
  no.style.top=(12+Math.random()*h)+"px";
}
["pointerenter","pointerdown","touchstart","click","mouseover"].forEach(function(ev){no.addEventListener(ev,dodge,{passive:false});});
yes.addEventListener("click",function(){
  $("ask").classList.remove("show");$("ask").style.display="none";
  no.style.display="none";
  var d=$("done");d.style.display="block";d.classList.add("show");
  for(var i=0;i<30;i++){
    var h=document.createElement("span");
    h.className="heart";h.textContent=["💗","💖","🌸","✨"][i%4];
    h.style.left=Math.random()*100+"vw";
    h.style.animationDelay=(Math.random()*1.6)+"s";
    document.body.appendChild(h);
  }
});

var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
var h1=$("ask").querySelector("h1"),full=h1.textContent;
function typeIn(){
  if(calm){$("ask").classList.add("ready");return}
  h1.textContent="";var i=0;
  var t=setInterval(function(){h1.textContent=full.slice(0,++i);
    if(i>=full.length){clearInterval(t);setTimeout(function(){$("ask").classList.add("ready")},250)}},75);
}
for(var q=0;q<36;q++){var st=document.createElement("span");st.className="star";
st.style.left=Math.random()*100+"vw";st.style.top=Math.random()*100+"vh";
st.style.animationDelay=(Math.random()*3)+"s";st.style.animationDuration=(2+Math.random()*3)+"s";document.body.appendChild(st);}
var last=0;
window.addEventListener("pointermove",function(e){
  var n=Date.now();if(n-last<70||calm)return;last=n;
  var sp=document.createElement("span");sp.className="spark";sp.textContent=["✨","💗","🌸"][Math.floor(Math.random()*3)];
  sp.style.left=e.clientX+"px";sp.style.top=e.clientY+"px";document.body.appendChild(sp);
  setTimeout(function(){sp.remove()},900);
});
yes.addEventListener("click",function(e){
  if(calm)return;
  var r=yes.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(var k=0;k<36;k++){
    var b=document.createElement("span");b.className="burst";b.textContent=["💗","💖","✨","🌸","💕"][k%5];
    var a=Math.random()*6.283,d=80+Math.random()*180;
    b.style.left=cx+"px";b.style.top=cy+"px";
    b.style.setProperty("--x",Math.cos(a)*d+"px");b.style.setProperty("--y",Math.sin(a)*d+"px");
    b.style.setProperty("--r",(Math.random()*360-180)+"deg");
    document.body.appendChild(b);
    (function(x){setTimeout(function(){x.remove()},1250)})(b);
  }
});
</script>
</body>
</html>
